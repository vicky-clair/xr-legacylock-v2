# 纯协议核心依赖：固定密码学库版本，保留 float_roundtrip 和 ryu-js 以匹配旧版数字签名输入。
[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "rand_core", "zeroize"] }
hkdf = "=0.12.4"
rand = "=0.8.5"
ryu-js = "=1.0.2"
scrypt = { version = "=0.11.0", default-features = false }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
zeroize = "=1.8.2"
